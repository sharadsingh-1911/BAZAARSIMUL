name: EOD price sync

on:
  schedule:
        # 16:00 UTC = 21:30 IST. Six hours after the 15:30 close. Yahoo's EOD
    # settlement for Indian equities is not instant, and an earlier pull
    # sometimes finds the day's bar still nulled.
    - cron: '0 16 * * 1-5'
  workflow_dispatch:          # run it by hand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Trigger sync on the deployed app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node src/jobs/triggerSync.js